plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ti.songdu'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ti.songdu'
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName "1.8.2"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 零第三方依赖：纯 Android 框架实现
}
