<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F8F5EF;color:#26221C;}
body{font-family:"Noto Serif CJK SC","Noto Serif SC","Songti SC",serif;}
.txt{padding:16px 20px 26px;line-height:2.15;}
body.fs0 .txt{font-size:18px}
body.fs1 .txt{font-size:21px}
body.fs2 .txt{font-size:25px}
body.fs3 .txt{font-size:30px}
ruby rt{font-size:.40em;color:#9a8f7d;}
/* 识读（v1.16.0）：读错的字，其拼音标红（只红拼音、不动字形与句高亮） */
ruby.rerr rt{color:#B03A2A;font-weight:700;}
/* 点句标记（v1.16.0）：浅黄/浅绿/浅蓝三色底纹。规则写在 .s.cur 之前——
   当前句的朱砂高亮要盖过标记色，人离开这句标记色自然回来，不会看混 */
.s.mk1{background:rgba(245,222,140,.38);}
.s.mk2{background:rgba(169,211,172,.34);}
.s.mk3{background:rgba(169,200,232,.32);}
body.nopy rt{display:none}
body.nopy .txt{line-height:1.95}
section.ch h2{font-size:1.02em;line-height:1.5;color:#9E3B2B;margin:1.1em 0 .45em;font-weight:700;letter-spacing:.04em;}
section.ch:first-child h2{margin-top:.15em}
.note{font-size:.72em;color:#A97C2C;margin:-.25em 0 .55em;}
/* 注释（v1.9.0）：注块是句后同级 span，默认藏起；body.noteson（横排）才成块展示。
   竖排永不进列流（!important），竖排注释走原生固定注栏。注文小一号、色淡一档，
   左侧细竖线＋浅底与正文分层；.cur 时竖线转朱砂、注文转朱砂深色、底色加深，与正文高亮同步。 */
.ntb{display:none;}
body.noteson .ntb{display:block;font-size:.72em;line-height:1.55;color:#6E6455;background:rgba(169,124,44,.07);border-left:3px solid #D8CDB4;padding:.5em .75em;margin:.4em 0 .9em;text-align:justify;}
body.vert .ntb{display:none !important;}
.ntb .ntf{display:block;margin-top:.35em;font-size:.86em;color:#A97C2C;user-select:none;-webkit-user-select:none;}
.ntb.cur{border-left-color:#9E3B2B;background:rgba(158,59,43,.12);}
.ntb.cur .ntt{color:#8A3226;}
p{margin:0;text-align:justify;}
.s{border-bottom:2px solid transparent;padding-bottom:1px;scroll-margin-top:14px;}
body.vert .s{scroll-margin-top:0;scroll-margin-right:14px;}
.s.cur{background:rgba(158,59,43,.14);border-bottom-color:#9E3B2B;}
/* 跟读 gap 阶段（v1.4.3）：当前句保持高亮但换金黄底＋虚线下划线，提示「轮到你复诵」 */
.s.cur.gap{background:rgba(169,124,44,.22);border-bottom-style:dashed;}
/* 小句级高亮（v1.8.2）：普通播放时当前句按 breaks 拆成小句 span，只高亮所在小句；
   整句的 .cur 样式在拆分后让位（.split 时句底色/下划线透明），由 .cl.cur 承接同一套朱砂样式 */
.s.split{background:transparent;border-bottom-color:transparent;}
.s.split .cl.cur{background:rgba(158,59,43,.14);border-bottom:2px solid #9E3B2B;padding-bottom:1px;}
body.vert .s.split{border-left-color:transparent;}
body.vert .s.split .cl.cur{background:rgba(158,59,43,.12);border-left:2px solid #9E3B2B;}
.s.na{color:#7d766b;}
#fin{text-align:center;padding:2.4em 0 3.2em;}
.finline{color:#8A8174;font-size:.8em;margin-bottom:1.1em;}
#finBtn{font-family:inherit;font-size:.85em;color:#9E3B2B;background:#FFFFFF;border:1px solid #9E3B2B;border-radius:999px;padding:.7em 1.6em;}
/* 竖排：列从右往左、字自上而下；拼音由 ruby 自然落到每字右侧；高亮句左侧朱砂竖线 */
body.vert .txt{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;height:100vh;padding:22px 18px;}
body.vert section.ch h2{margin:0 .35em 0 .95em;}
body.vert .note{margin:0 .3em 0 .6em;}
body.vert .s.cur{background:rgba(158,59,43,.12);border-bottom-color:transparent;border-left:2px solid #9E3B2B;}
body.vert .s.cur.gap{background:rgba(169,124,44,.20);border-left-style:dashed;}
body.vert p{text-align:start;}
/* 竖版分页（v1.8.0）：页面静止——禁止手势自由滚动（程序滚动翻页不受影响） */
body.vert{touch-action:none;overscroll-behavior:none;}
/* 左缘翻页提示：只在左缘中部留一个 ≤20dp 的淡色小箭头，不占正文列宽（正文仍按全宽排） */
#pgHint{display:none;position:fixed;left:3px;top:50%;transform:translateY(-50%);font-size:22px;line-height:1;color:rgba(38,34,28,.20);pointer-events:none;z-index:5;}
body.vert #pgHint{display:block;}
/* 竖排诊断读数（v1.10.1）：左下角极小淡字，页号/滚动位置/内容宽/校准模型全部取运行时实测值 */
#vdbg{display:none;position:fixed;left:6px;bottom:6px;font-size:10px;line-height:1.5;color:rgba(38,34,28,.45);background:rgba(248,245,239,.55);padding:1px 6px;border-radius:6px;pointer-events:none;z-index:6;font-family:monospace;}
body.vert #vdbg{display:block;}
/* 竖排自校准的后备滚动主体（v1.10.1）：仅当窗口滚不动正文时才由 JS 给 body 加此类，
   让 .txt 自己当滚动容器。必须显式给宽：.txt 在竖排下按内容撑开（实测宽=全文宽），
   不钉到视口宽它就「自己装下全部内容」、无从内滚 */
body.vert.vtxt .txt{overflow-x:auto;overflow-y:hidden;touch-action:none;width:100vw;}
</style>
</head>
<body class="__CLASSES__">
<div class="txt" id="txt"></div>
<div id="pgHint">‹</div>
<div id="vdbg"></div>
<script>
var BOOK = __BOOK_JSON__;
var stateTrad = __TRAD__;
var notesVer = '__NOTES_VER__';
var cur = -1;
var gapOn = false;
var immersive = false;
var flat = [];
BOOK.chapters.forEach(function(ch){
  ch.sentences.forEach(function(s){ s._i = flat.length; flat.push(s); });
});
function isCJK(c){
  var n = c.codePointAt(0);
  /* 含扩展区（论语有少量扩展 B–J 区生僻字，如简体「𫐐/𬶍」） */
  return (n >= 0x4E00 && n <= 0x9FFF) || (n >= 0x3400 && n <= 0x4DBF) ||
         (n >= 0x20000 && n <= 0x323AF);
}
function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function sentHTML(s){
  var text = stateTrad ? s.textT : s.textS;
  var pi = 0, out = '';
  /* 按码点遍历：扩展区字是 UTF-16 代理对，按下标遍历会把一个字拆成两半 */
  for (const c of text){
    if (isCJK(c)){
      var py = (s.pinyin && pi < s.pinyin.length) ? s.pinyin[pi] : '';
      pi++;
      out += py ? '<ruby>' + c + '<rt>' + esc(py) + '</rt></ruby>' : c;
    } else {
      out += esc(c);
    }
  }
  return '<span class="s' + (s.noAudio ? ' na' : '') + '" id="si' + s._i +
         '" data-i="' + s._i + '">' + out + '</span>';
}
/* ===== 注释（v1.9.0；v1.20.5 起三家）=====
   句子对象的 nt 字段由 ContentRepo 注入：nt.zj / nt.jz / nt.gf = {t 注文, a 块首拉平下标,
   b 块末拉平下标}，是「覆盖本句的那一块」在该版本下的判定结果。显示时优先当前
   选定版本（notesVer），该版本无块覆盖才按固定次序回退其他家，页脚如实标实际显示的那家。
   古人按段注、块内每句共用此注，所以每句后面都挂同一块注（本节口径）。
   注块是句子 span 的同级后随元素（不在 .s 内部，不干扰小句拆分与点句 seek）。 */
var NOTE_VER_KEYS = [['zhijie','zj'], ['jizhu','jz'], ['gengfu','gf']];
function noteFor(s){
  if (!s || !s.nt) return null;
  var order = [];
  NOTE_VER_KEYS.forEach(function(p){ if (p[0] === notesVer) order.push(p[1]); });
  NOTE_VER_KEYS.forEach(function(p){ if (p[0] !== notesVer) order.push(p[1]); });
  for (var i = 0; i < order.length; i++){
    var n = s.nt[order[i]];
    if (n) return {t:n.t, a:n.a, b:n.b, ver:order[i]};
  }
  return null;
}
function noteFooter(n){
  var lab = n.ver === 'zj' ? '张居正的版本' : n.ver === 'jz' ? '朱熹的版本' : '耕夫讲经典';
  if (n.b > n.a) lab += ' · 本注管第 ' + (n.a + 1) + '–' + (n.b + 1) + ' 句';
  return lab;
}
function noteHTML(s){
  var n = noteFor(s);
  if (!n) return '';
  return '<span class="ntb" id="nt' + s._i + '"><span class="ntt">' + esc(n.t) +
         '</span><span class="ntf">' + esc(noteFooter(n)) + '</span></span>';
}
function fillNote(i){
  var d = document.getElementById('nt' + i);
  if (!d) return;
  var n = noteFor(flat[i]);
  if (!n) return;
  d.querySelector('.ntt').textContent = n.t;
  d.querySelector('.ntf').textContent = noteFooter(n);
}
/* 版本切换：全书注块按新版本重填（文本＋页脚），选择由原生侧持久化后回推 */
function setNotesVer(v){
  notesVer = v;
  for (var i = 0; i < flat.length; i++) fillNote(i);
}
function setNotesOn(on){
  document.body.classList.toggle('noteson', !!on);
}
/* 当前句的注块同步亮起：与 markCur 同步调用；同块内换句时新句的注块接棒亮起
   （块内每句各有一份同文注块，亮的始终是当前句那一份） */
var curNoteEl = null;
function markNote(i){
  if (curNoteEl){ curNoteEl.classList.remove('cur'); curNoteEl = null; }
  if (i >= 0){
    var n = document.getElementById('nt' + i);
    if (n){ n.classList.add('cur'); curNoteEl = n; }
  }
}
/* 翻页式跟随（v1.4.2，用户要求像读书翻页，不要当前句永远居中）：
   - 当前句完整落在可视区内 → 绝不滚动；
   - 当前句跑出可视区（横排在上方/下方之外、竖排在左侧/右侧之外，含 seek 回前面）
     → 一次性翻一页：scrollIntoView({block:'start'}) 让它落到新一页的页首——
     横排 block start = 视口顶部（scroll-margin-top 留 14px 边距）；
     竖排 writing-mode 下 block 轴为右→左，block start = 视口右端
     （scroll-margin-right 留 14px 边距），即句的起始边贴到页首。 */
function sentenceVisible(el){
  var r = el.getBoundingClientRect();
  if (document.body.classList.contains('vert')){
    return r.left >= -1 && r.right <= window.innerWidth + 1;
  }
  return r.top >= -1 && r.bottom <= window.innerHeight + 1;
}
function pageToSentence(el){
  if (sentenceVisible(el)) return;
  el.scrollIntoView({block:'start', inline:'nearest'});
}
/* ===== 竖版分页（v1.8.0 定案：一屏一页、页面静止、像翻书；v1.10.1 滚动层重做）=====
   页格几何（沿用，实测正确）：竖排下整幅正文是从右往左延展的长卷，页宽 = 视口宽 W；
   句子位置用「距长卷起始边（右端）的距离 d」度量：d = refRight - elRect.right
   （两 rect 随滚动同移，d 与滚动位置无关）；页号 = floor(d / W)，固定页格。
   当前句只原地变色高亮、绝不自动滚动；仅当播放/跟读推进到的句子不在当前页
   时才翻页。手动翻页（点左/右缘 28px 热区或左右滑）走 flipPage，并通知原生侧
   暂停跟随（与既有 userScrolled 机制一致）。横版一律不走这套逻辑。 */
var pgCur = 0, pgTotal = 0;
function isVert(){ return document.body.classList.contains('vert'); }
function txtEl(){ return document.getElementById('txt'); }
function firstSection(){ return txtEl().querySelector('section.ch'); }
function contentWidth(){
  /* .txt 自己当滚动容器时用它的 scrollWidth；窗口滚动时用 #txt 右缘到 #fin 左缘的跨度
     （#txt 的 border box 宽在本引擎实测等于内容宽，fin 项是另一量法的交叉校验） */
  if (V.subject === 'txt') return txtEl().scrollWidth || 0;
  var tr = txtEl().getBoundingClientRect();
  var w = tr.width;
  var fin = document.getElementById('fin');
  if (fin) w = Math.max(w, tr.right - fin.getBoundingClientRect().left);
  return w;
}
function vertMeasure(){
  pgTotal = Math.max(1, Math.ceil(contentWidth() / window.innerWidth));
}
/* 距起始边的参照右缘：窗口滚动时 #txt 右缘随文档同移；.txt 当容器时它自己的边不动，
   改用第一章 section 的右缘（内容本身，随内滚同移） */
function vertRefRight(){
  if (V.subject === 'txt'){
    var s = firstSection();
    if (s) return s.getBoundingClientRect().right;
  }
  return txtEl().getBoundingClientRect().right;
}
function pageOfSentence(el){
  var r = el.getBoundingClientRect();
  var p = Math.floor((vertRefRight() - r.right) / window.innerWidth);
  return Math.max(0, Math.min(pgTotal - 1, p));
}
function reportPage(){
  if (window.Bridge && Bridge.pageInfo)
    Bridge.pageInfo(isVert() ? pgCur + 1 : 0, isVert() ? pgTotal : 0);
  updateVdbg();
}
/* ===== 竖排滚动自校准（v1.10.1）=====
   旧版假设「Chromium 竖排是负值模型、第 k 页 scrollLeft = -k*W」——2026-10-23 实测
   （桌面 Chromium headless 复现，真机症状互证）证明不成立：本页根元素是 horizontal-tb、
   竖排只加在 .txt 上，滚动模型由根滚动器决定——正文在文档里向右延展，结尾在文档左端、
   开头在右端，scrollLeft ∈ [0, 内容宽-视口宽]，写入负值被钳到 0（「反向模型」：0=结尾、
   最大值=开头）。旧 goPage 写出的负值全军覆没、画面一帧不动，pgCur 却乐观自增并向
   原生侧谎报页码——打开停结尾、不自动翻页、滑动/点按无效、跳转无效，四个症状同源。
   故本引擎不预设模型：进竖排/布局变化时实测——依次试探滚动主体（先窗口、
   后 .txt 自身），把 scrollLeft 顶到两端读回真实可达区间，再看第一句在哪一端可见
   定下「第 0 页的 scrollLeft」(sPage0)，每页朝另一端步进一个视口宽 (ds=±W)、钳在
   区间内。负值/正值/反向三种模型都归结为这组实测参数。goPage 写完定时读回校验，
   页号对不上就作废校准、强制重测并瞬时重试一次；另有 scroll 监听把 pgCur 持续
   同步回实际位置，不再乐观漂移。校准按 (视口宽高, 内容宽) 缓存，布局变化自动重测。 */
var V = {ok:false, subject:'win', sMin:0, sMax:0, sPage0:0, ds:0, cw:0, key:'', failKey:'', model:'?'};
var calibBusy = false, calibWaiters = [];
function subjectElFor(subj){
  return subj === 'txt' ? txtEl() : (document.scrollingElement || document.documentElement);
}
function getSL(){
  var se = subjectElFor(V.subject);
  return se ? (se.scrollLeft || 0) : 0;
}
function setSL(v, animate){
  var se = subjectElFor(V.subject);
  if (!se) return;
  if (animate){
    try {
      if (V.subject === 'win') window.scrollTo({left: v, behavior: 'smooth'});
      else se.scrollTo({left: v, behavior: 'smooth'});
      return;
    } catch (e) {}
  }
  se.scrollLeft = v;
}
/* 第 k 页的 scrollLeft（纯函数：实测锚点 + 每页一个视口宽，钳在可达区间内） */
function pageScrollLeft(k){
  var s = V.sPage0 + V.ds * k;
  return Math.max(V.sMin, Math.min(V.sMax, s));
}
/* 由实际 scrollLeft 反推页号（读回校验与 pgCur 同步用） */
function pageFromSL(s){
  if (!V.ok || !V.ds) return pgCur;
  var k = Math.round((s - V.sPage0) / V.ds);
  return Math.max(0, Math.min(pgTotal - 1, k));
}
function elVisibleX(el){
  if (!el) return false;
  var r = el.getBoundingClientRect();
  return r.right > 2 && r.left < window.innerWidth - 2;
}
function vertRefRightFor(subj){
  if (subj === 'txt'){
    var s = firstSection();
    if (s) return s.getBoundingClientRect().right;
  }
  return txtEl().getBoundingClientRect().right;
}
function calibKey(){
  return window.innerWidth + 'x' + window.innerHeight + '|' + Math.round(contentWidth());
}
function ensureCalibrated(cb){
  if (!isVert()){ if (cb) cb(false); return; }
  if (V.ok && V.key === calibKey()){ if (cb) cb(true); return; }
  if (!V.ok && V.failKey && V.failKey === calibKey()){ if (cb) cb(false); return; }
  if (cb) calibWaiters.push(cb);
  if (calibBusy) return;
  calibBusy = true;
  calibrateRun(function(ok){
    calibBusy = false;
    var ws = calibWaiters; calibWaiters = [];
    for (var i = 0; i < ws.length; i++) ws[i](ok);
  });
}
function calibrateRun(done){
  var subjects = ['win', 'txt'];
  var idx = 0;
  (function next(){
    if (idx >= subjects.length){
      V.ok = false; V.subject = 'win'; V.model = 'fail';
      document.body.classList.remove('vtxt');
      V.failKey = calibKey();
      updateVdbg();
      done(false);
      return;
    }
    probeSubject(subjects[idx++], function(ok){ if (ok) done(true); else next(); });
  })();
}
/* 在候选主体上实测：顶两端读回区间 → 内容宽与区间对账 → 看第一句在哪端定 sPage0。
   试探期间页面会短暂跳到两端（约 200ms），结束由调用方 goPage 落回目标页。 */
function probeSubject(subj, done){
  var W = window.innerWidth;
  if (subj === 'txt') document.body.classList.add('vtxt');
  else document.body.classList.remove('vtxt');
  void document.body.offsetWidth; /* 强制重排，让滚动容器身份先生效 */
  var se = subjectElFor(subj);
  if (!se){ done(false); return; }
  var sSave = se.scrollLeft || 0;
  var cw = (subj === 'txt') ? (txtEl().scrollWidth || 0) : contentWidth();
  function fail(){ try { se.scrollLeft = sSave; } catch (e) {} done(false); }
  se.scrollLeft = -1000000000;
  setTimeout(function(){
    var sA = se.scrollLeft || 0;
    se.scrollLeft = 1000000000;
    setTimeout(function(){
      var sB = se.scrollLeft || 0;
      var sMin = Math.min(sA, sB), sMax = Math.max(sA, sB);
      var range = sMax - sMin;
      var need = cw - W;
      /* 内容明显超过一页、这个主体却滚不出对应距离 → 它不是（合格的）滚动主体 */
      if (need > 2 && range < need - 2){ fail(); return; }
      var si0 = document.getElementById('si0');
      se.scrollLeft = sMin;
      setTimeout(function(){
        var visMin = elVisibleX(si0), rMin = vertRefRightFor(subj);
        se.scrollLeft = sMax;
        setTimeout(function(){
          var visMax = elVisibleX(si0), rMax = vertRefRightFor(subj);
          var sPage0;
          if (visMin && !visMax) sPage0 = sMin;
          else if (visMax && !visMin) sPage0 = sMax;
          else /* 两端都看得见第一句（内容仅略超一页）：取起始边离视口右缘更近的那端 */
            sPage0 = Math.abs(rMin - W) <= Math.abs(rMax - W) ? sMin : sMax;
          var endS = (sPage0 === sMin) ? sMax : sMin;
          V.subject = subj; V.sMin = sMin; V.sMax = sMax; V.sPage0 = sPage0;
          V.ds = endS >= sPage0 ? W : -W;
          V.cw = cw; V.ok = true; V.failKey = '';
          V.model = (subj === 'txt' ? 'txt-' : '') +
            (sMin < 0 ? 'neg' : (sPage0 === sMax && sMax > 0 ? 'rev' : 'pos'));
          V.key = calibKey();
          updateVdbg();
          done(true);
        }, 50);
      }, 50);
    }, 50);
  }, 50);
}
var verifyTimer = 0;
function goPage(k, animate){ goPageInner(k, animate, false); }
function goPageInner(k, animate, retried){
  if (!isVert()) return;
  vertMeasure();
  k = Math.max(0, Math.min(pgTotal - 1, k));
  pgCur = k;
  if (!V.ok){
    ensureCalibrated(function(ok){ if (ok) goPageInner(k, animate, retried); });
    reportPage();
    return;
  }
  var startSL = getSL();
  setSL(pageScrollLeft(k), animate);
  reportPage();
  /* 写后读回校验：页号对不上（写入被钳/模型与实测不符）→ 作废校准强制重测，瞬时重试一次。
     平滑滚动可能还没走完：只要读数还在朝目标变就宽限续等，稳定不动且页号不对才判失败 */
  clearTimeout(verifyTimer);
  if (!retried)
    verifyTimer = setTimeout(function(){ verifyStep(k, animate ? 5 : 1, startSL); },
                               animate ? 480 : 90);
}
function verifyStep(k, triesLeft, lastSL){
  if (!isVert() || !V.ok) return;
  var s = getSL();
  if (pageFromSL(s) === k) return;
  if (triesLeft > 0 && s !== lastSL){
    verifyTimer = setTimeout(function(){ verifyStep(k, triesLeft - 1, s); }, 300);
    return;
  }
  V.ok = false; V.failKey = '';
  ensureCalibrated(function(ok){ if (ok) goPageInner(k, false, true); });
}
function vertFollow(el){
  vertMeasure();
  if (!V.ok){
    ensureCalibrated(function(ok){ if (ok) vertFollow(el); });
    return;
  }
  var p = pageOfSentence(el);
  if (p !== pgCur) goPage(p, true);
}
/* 跟随态（v1.19.0）：原生侧 FollowGate 推送。竖排重分页的锚点按它决定：
   跟随中 → 回到当前句所在页；不跟随时 → 留在用户正看的页（钳制越界），
   绝不借布局变化之名把视图拽到播放句去 */
var followGateOn = false;
function setFollowGate(on){ followGateOn = !!on; }
/* 布局变化（字号/注音/繁简重渲/旋转）后重新分页 */
function repaginate(){
  if (!isVert()){ reportPage(); return; }
  vertMeasure();
  ensureCalibrated(function(ok){
    if (!isVert() || !ok) return;
    vertMeasure();
    var target = pgCur;
    if (followGateOn && cur >= 0){
      var el = document.getElementById('si' + cur);
      if (el) target = pageOfSentence(el);
    }
    goPage(Math.max(0, Math.min(pgTotal - 1, target)), false);
  });
}
function flipPage(dir, manual){
  if (!isVert()) return;
  vertMeasure();
  var k = pgCur + dir;
  if (k < 0 || k > pgTotal - 1) return;
  goPage(k, true);
  if (manual) Bridge.userScrolled();
}
/* pgCur 诚实化：滚动（程序平滑滚动/任何漂移）后按实际 scrollLeft 反推页号同步，
   不再让 pgCur 停留在「写出去的值」上 */
var scrollSyncQueued = false;
function onScrollAny(){
  if (!isVert() || !V.ok || scrollSyncQueued) return;
  scrollSyncQueued = true;
  setTimeout(function(){
    scrollSyncQueued = false;
    if (!isVert() || !V.ok) return;
    var k = pageFromSL(getSL());
    if (k !== pgCur){ pgCur = k; reportPage(); }
    updateVdbg();
  }, 60);
}
/* 诊断读数（值全部取运行时实测：页号/实际 scrollLeft/内容宽/校准出的模型名） */
function updateVdbg(){
  var d = document.getElementById('vdbg');
  if (!d) return;
  if (!isVert()){ d.textContent = ''; return; }
  d.textContent = 'pg ' + (pgCur + 1) + '/' + pgTotal +
    ' sl=' + Math.round(getSL()) +
    ' cw=' + Math.round(contentWidth()) +
    ' m=' + V.model;
}
/* 测试/诊断钩子：返回校准实测参数（无副作用） */
window.__vertState = function(){
  return {ok: V.ok, subject: V.subject, model: V.model, sMin: V.sMin, sMax: V.sMax,
          sPage0: V.sPage0, ds: V.ds, pgCur: pgCur, pgTotal: pgTotal};
};
window.__vertCalibrate = function(){ V.ok = false; V.failKey = ''; ensureCalibrated(function(){}); };
/* ===== 识读标红＋点句标记（v1.16.0）=====
   reciteErrs: flat → 读错字在句内的汉字序号集合（原生侧 ReciteSession 下发）；
   sentMarks: flat → 标记色 1 浅黄 / 2 浅绿 / 3 浅蓝（原生侧 NotesStore 下发）。
   两者都是「重渲染后重放」口径：render 分批建 DOM、markCur 拆/合小句都会重建
   句子内部节点，class 会被冲掉，故 render 完成与 markCur 结尾都调 paintAll 重放。 */
var reciteErrs = {};
var sentMarks = {};
function setReciteErr(i, ci){
  if (!reciteErrs[i]) reciteErrs[i] = {};
  reciteErrs[i][ci] = true;
  paintSent(i);
}
function clearReciteErrs(){
  reciteErrs = {};
  document.querySelectorAll('ruby.rerr').forEach(function(r){ r.classList.remove('rerr'); });
}
function setMarks(m){
  sentMarks = m || {};
  paintAllRecite();
}
function setMark(i, mk){
  if (mk) sentMarks[i] = mk; else delete sentMarks[i];
  paintSent(i);
}
function paintSent(i){
  var el = document.getElementById('si' + i);
  if (!el) return;
  el.classList.remove('mk1', 'mk2', 'mk3');
  var mk = sentMarks[i];
  if (mk) el.classList.add('mk' + mk);
  var errs = reciteErrs[i];
  if (!errs) return;
  /* 按文档顺序走后代节点：每个 ruby 是一个汉字位；裸文本里的汉字也占位
     （无拼音的字没有 ruby 可红，跳过计数但不标） */
  var counter = 0;
  (function walk(node){
    for (var k = 0; k < node.childNodes.length; k++){
      var ch = node.childNodes[k];
      if (ch.nodeType === 1 && ch.tagName === 'RUBY'){
        if (errs[counter]) ch.classList.add('rerr');
        counter++;
      } else if (ch.nodeType === 3){
        for (const c of ch.textContent) if (isCJK(c)) counter++;
      } else if (ch.nodeType === 1){
        walk(ch);
      }
    }
  })(el);
}
function paintAllRecite(){
  for (var i in reciteErrs) paintSent(parseInt(i, 10));
  for (var j in sentMarks) paintSent(parseInt(j, 10));
}
function markCur(i, scroll){
  if (cur >= 0){
    if (splitEl && splitIdx === cur) unsplit();
    var p = document.getElementById('si' + cur);
    if (p){ p.classList.remove('cur'); p.classList.remove('gap'); }
  }
  cur = i;
  if (i >= 0){
    var el = document.getElementById('si' + i);
    if (el){
      el.classList.add('cur');
      if (gapOn) el.classList.add('gap');
      splitSentence(el, flat[i]);
      if (scroll){ if (isVert()) vertFollow(el); else pageToSentence(el); }
    }
  }
  markNote(i);
  paintAllRecite();
}
function setCur(i, scroll){ markCur(i, scroll); }
/* ===== 小句级高亮（v1.8.2）=====
   普通播放时把当前句按 breaks 拆成小句 span（切分与逗号级 SRT 完全同源：
   句内按 breaks.p 断开、标点后收尾符归前一小句、句末小句到 endMs），
   只给播放位置所在小句加 .cur（朱砂）。当前句的判定/跟随/seek 仍以整句为
   单位（markCur/pageToSentence/vertFollow 不变）；只在当前句变化时重建子
   span、小句变化时只挪 class。跟读模式不拆小句（setFollowMode 还原整句，
   保持既有整句高亮＋gap 呈现）。无 breaks 的句子整句即一个小句、不拆。 */
var CLOSERS = new Set(Array.from('」』）》”’】〕〉'));
var splitEl = null, splitOrigHTML = null, splitIdx = -1;
var wantClause = 0, curClause = -1;
var followMode = false;
function clauseRanges(s){
  var text = stateTrad ? s.textT : s.textS;
  if (!s.breaks || !s.breaks.length) return null;
  var cps = Array.from(text);
  var u16 = new Array(cps.length), acc = 0;
  for (var j = 0; j < cps.length; j++){ u16[j] = acc; acc += cps[j].length; }
  var ends = [];
  for (var bi = 0; bi < s.breaks.length; bi++){
    var j = u16.indexOf(s.breaks[bi].p);
    if (j < 0) continue;
    var e = j;
    while (e + 1 < cps.length && CLOSERS.has(cps[e + 1])) e++;
    if (e >= cps.length - 1) continue;
    ends.push(e);
  }
  if (!ends.length) return null;
  var ranges = [], prev = 0;
  for (var k = 0; k < ends.length; k++){ ranges.push([prev, ends[k] + 1]); prev = ends[k] + 1; }
  if (prev < cps.length) ranges.push([prev, cps.length]);
  return ranges.length > 1 ? ranges : null;
}
function clauseHTML(s, ranges){
  var text = stateTrad ? s.textT : s.textS;
  var cps = Array.from(text);
  var pi = 0, out = '<span class="cl" data-cl="0">', ci = 0;
  for (var j = 0; j < cps.length; j++){
    if (ci < ranges.length - 1 && j === ranges[ci][1]){
      ci++;
      out += '</span><span class="cl" data-cl="' + ci + '">';
    }
    var c = cps[j];
    if (isCJK(c)){
      var py = (s.pinyin && pi < s.pinyin.length) ? s.pinyin[pi] : '';
      pi++;
      out += py ? '<ruby>' + c + '<rt>' + esc(py) + '</rt></ruby>' : c;
    } else out += esc(c);
  }
  return out + '</span>';
}
function applyClause(){
  if (!splitEl){ curClause = -1; return; }
  var cls = splitEl.querySelectorAll('.cl');
  if (curClause >= 0 && curClause < cls.length) cls[curClause].classList.remove('cur');
  curClause = (wantClause >= 0 && wantClause < cls.length) ? wantClause : -1;
  if (curClause >= 0) cls[curClause].classList.add('cur');
}
function setClause(k){ wantClause = k; if (splitEl) applyClause(); }
function unsplit(){
  if (!splitEl) return;
  splitEl.innerHTML = splitOrigHTML;
  splitEl.classList.remove('split');
  splitEl = null; splitOrigHTML = null; splitIdx = -1; curClause = -1;
}
function splitSentence(el, s){
  if (followMode || !s) return;
  var ranges = clauseRanges(s);
  if (!ranges) return;
  splitEl = el; splitOrigHTML = el.innerHTML; splitIdx = s._i;
  el.innerHTML = clauseHTML(s, ranges);
  el.classList.add('split');
  curClause = -1;
  applyClause();
}
function setFollowMode(on){
  followMode = !!on;
  if (followMode){ unsplit(); paintAllRecite(); return; }
  if (cur >= 0 && splitIdx !== cur){
    var el = document.getElementById('si' + cur);
    if (el) splitSentence(el, flat[cur]);
  }
  paintAllRecite();
}
/* 跟读 gap 标记（v1.4.3）：只改当前句的呈现，不动高亮位置与翻页跟随 */
function setGap(on){
  gapOn = !!on;
  if (cur >= 0){
    var el = document.getElementById('si' + cur);
    if (el) el.classList.toggle('gap', gapOn);
  }
}
function render(){
  /* v1.5 分批渲染：论语单篇最长约 130 句、带注音的 DOM 节点数千，先出前两章
     立即可读，其余每批 4 章在后续帧补齐（元素齐了之后再补发一次当前句高亮），
     避免一次性 innerHTML 上万节点卡住首屏。大学/中庸章数少，行为与旧版无异。 */
  curNoteEl = null;
  var parts = [];
  BOOK.chapters.forEach(function(ch){
    var h = '<section class="ch"><h2>' + esc(ch.title) + '</h2>';
    if (ch.note) h += '<div class="note">' + esc(ch.note) + '</div>';
    h += '<p>';
    ch.sentences.forEach(function(s){ h += sentHTML(s); h += noteHTML(s); });
    h += '</p></section>';
    parts.push(h);
  });
  var finH = '<div id="fin"><div class="finline">—— 全文完 ——</div>' +
       '<button id="finBtn" type="button">已读到末尾 · 点此记一遍</button></div>';
  var el = document.getElementById('txt');
  var i = Math.min(2, parts.length);
  el.innerHTML = parts.slice(0, i).join('');
  function step(){
    if (i < parts.length){
      el.insertAdjacentHTML('beforeend', parts.slice(i, i + 4).join(''));
      i += 4;
      setTimeout(step, 0);
      return;
    }
    el.insertAdjacentHTML('beforeend', finH);
    document.getElementById('finBtn').addEventListener('click', function(e){
      e.stopPropagation();
      Bridge.finishRead();
    });
    if (cur >= 0) markCur(cur, false);
    paintAllRecite();
    repaginate();
  }
  if (i < parts.length) setTimeout(step, 0); else step();
}
function setTrad(t){ stateTrad = t; render(); }
function setFont(i){
  document.body.classList.remove('fs0','fs1','fs2','fs3');
  document.body.classList.add('fs' + i);
  requestAnimationFrame(repaginate);
}
function setPinyin(on){
  document.body.classList.toggle('nopy', !on);
  requestAnimationFrame(repaginate);
}
function setVert(v){
  document.body.classList.toggle('vert', v);
  if (v){ setTimeout(repaginate, 30); }
  else { document.body.classList.remove('vtxt'); pgCur = 0; reportPage(); }
}
function goTop(){
  if (isVert()){ goPage(0, false); return; }
  window.scrollTo(0, 0);
  var e = document.querySelector('section.ch');
  if (e) e.scrollIntoView();
}
document.addEventListener('click', function(e){
  if (immersive){ immersive = false; Bridge.setImmersive(false); return; }
  if (isVert()){
    if (justSwiped()) return;
    /* 点左/右缘热区翻页（左 = 下一页、右 = 上一页，同竖排书翻页方向）；
       热区全透明、不占正文列宽，仅左缘中部有一个淡色小箭头提示 */
    if (e.clientX <= 28){ flipPage(1, true); return; }
    if (e.clientX >= window.innerWidth - 28){ flipPage(-1, true); return; }
  }
  /* 注释页脚自 v1.10.2 起只是静态标注（版本切换在「注释」按钮开启时选）；
     注块本体点按不触发任何动作（不 seek、不沉浸），页脚在注块内一并被吞 */
  if (e.target.closest && e.target.closest('.ntb')) return;
  var t = e.target;
  var s = t.closest ? t.closest('.s') : null;
  if (s){
    var i = parseInt(s.getAttribute('data-i'), 10);
    if (s.classList.contains('na')) Bridge.naTap(); else Bridge.sentence(i);
    return;
  }
  if (t.closest && t.closest('#fin')) return;
  immersive = true;
  Bridge.setImmersive(true);
});
/* 横排：用户手动滑动 → 退出跟随（v1.19.0 跟随状态机在原生侧）。
   可靠区分「人滑」与「程序滚」：touchmove/wheel 只有真人手势能产生，程序滚动
   （scrollIntoView/scrollTo）不触发这两个事件，天然不会误报；再加 12px 位移
   阈值——点按的轻微抖动、点句 seek 的触摸不算滑动，一次触摸只上报一次。
   竖排页面静止、无自由滚动，手动翻页已由 flipPage 自己上报 userScrolled，
   这里不再重复上报。 */
var hStartX = 0, hStartY = 0, hSwipeReported = false;
document.addEventListener('touchstart', function(e){
  if (e.touches.length === 1){
    hStartX = e.touches[0].clientX; hStartY = e.touches[0].clientY;
    hSwipeReported = false;
  }
}, {passive:true});
document.addEventListener('touchmove', function(e){
  if (isVert() || hSwipeReported || !e.touches.length) return;
  var dx = e.touches[0].clientX - hStartX, dy = e.touches[0].clientY - hStartY;
  if (dx * dx + dy * dy > 144){ hSwipeReported = true; Bridge.userScrolled(); }
}, {passive:true});
document.addEventListener('wheel', function(){ if (!isVert()) Bridge.userScrolled(); }, {passive:true});
/* 竖排 pgCur 同步：窗口与 .txt（后备主体）任一滚动都把实际页号同步回来 */
window.addEventListener('scroll', onScrollAny, {passive:true});
txtEl().addEventListener('scroll', onScrollAny, {passive:true});
/* 竖版：左右滑翻页（内容跟随手指方向：右滑露出下一页、左滑回上一页）；
   滑动后 350ms 内的合成 click 不再当作点按处理 */
var tsX = 0, tsY = 0, swipeAt = 0;
function justSwiped(){ return Date.now() - swipeAt < 350; }
document.addEventListener('touchstart', function(e){
  if (e.touches.length === 1){ tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; }
}, {passive:true});
document.addEventListener('touchend', function(e){
  if (!isVert() || !e.changedTouches.length) return;
  var dx = e.changedTouches[0].clientX - tsX;
  var dy = e.changedTouches[0].clientY - tsY;
  if (Math.abs(dx) >= 48 && Math.abs(dx) > 1.4 * Math.abs(dy)){
    flipPage(dx > 0 ? 1 : -1, true);
    swipeAt = Date.now();
  }
}, {passive:true});
/* 竖版禁止滚轮把长卷拖离页格（程序翻页不受影响） */
document.addEventListener('wheel', function(e){ if (isVert()) e.preventDefault(); }, {passive:false});
/* 旋转/窗口尺寸变化后重新分页，回到当前句所在页 */
var rszT = 0;
window.addEventListener('resize', function(){
  clearTimeout(rszT);
  rszT = setTimeout(repaginate, 120);
});
render();
</script>
</body>
