<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F8F5EF;color:#26221C;}
body{font-family:"Noto Serif CJK SC","Noto Serif SC","Songti SC",serif;}
.txt{padding:16px 20px 26px;line-height:2.15;}
body.fs0 .txt{font-size:18px}
body.fs1 .txt{font-size:21px}
body.fs2 .txt{font-size:25px}
body.fs3 .txt{font-size:30px}
ruby rt{font-size:.40em;color:#9a8f7d;}
body.nopy rt{display:none}
body.nopy .txt{line-height:1.95}
section.ch h2{font-size:1.02em;line-height:1.5;color:#9E3B2B;margin:1.1em 0 .45em;font-weight:700;letter-spacing:.04em;}
section.ch:first-child h2{margin-top:.15em}
.note{font-size:.72em;color:#A97C2C;margin:-.25em 0 .55em;}
/* 注释（v1.9.0）：注块是句后同级 span，默认藏起；body.noteson（横排）才成块展示。
   竖排永不进列流（!important），竖排注释走原生固定注栏。注文小一号、色淡一档，
   左侧细竖线＋浅底与正文分层；.cur 时竖线转朱砂、注文转朱砂深色、底色加深，与正文高亮同步。 */
.ntb{display:none;}
body.noteson .ntb{display:block;font-size:.76em;line-height:1.8;color:#6E6455;background:rgba(169,124,44,.07);border-left:3px solid #D8CDB4;padding:.5em .75em;margin:.4em 0 .9em;text-align:justify;}
body.vert .ntb{display:none !important;}
.ntb .ntf{display:block;margin-top:.35em;font-size:.86em;color:#A97C2C;cursor:pointer;user-select:none;-webkit-user-select:none;}
.ntb.cur{border-left-color:#9E3B2B;background:rgba(158,59,43,.12);}
.ntb.cur .ntt{color:#8A3226;}
p{margin:0;text-align:justify;}
.s{border-bottom:2px solid transparent;padding-bottom:1px;scroll-margin-top:14px;}
body.vert .s{scroll-margin-top:0;scroll-margin-right:14px;}
.s.cur{background:rgba(158,59,43,.14);border-bottom-color:#9E3B2B;}
/* 跟读 gap 阶段（v1.4.3）：当前句保持高亮但换金黄底＋虚线下划线，提示「轮到你复诵」 */
.s.cur.gap{background:rgba(169,124,44,.22);border-bottom-style:dashed;}
/* 小句级高亮（v1.8.2）：普通播放时当前句按 breaks 拆成小句 span，只高亮所在小句；
   整句的 .cur 样式在拆分后让位（.split 时句底色/下划线透明），由 .cl.cur 承接同一套朱砂样式 */
.s.split{background:transparent;border-bottom-color:transparent;}
.s.split .cl.cur{background:rgba(158,59,43,.14);border-bottom:2px solid #9E3B2B;padding-bottom:1px;}
body.vert .s.split{border-left-color:transparent;}
body.vert .s.split .cl.cur{background:rgba(158,59,43,.12);border-left:2px solid #9E3B2B;}
.s.na{color:#7d766b;}
#fin{text-align:center;padding:2.4em 0 3.2em;}
.finline{color:#8A8174;font-size:.8em;margin-bottom:1.1em;}
#finBtn{font-family:inherit;font-size:.85em;color:#9E3B2B;background:#FFFFFF;border:1px solid #9E3B2B;border-radius:999px;padding:.7em 1.6em;}
/* 竖排：列从右往左、字自上而下；拼音由 ruby 自然落到每字右侧；高亮句左侧朱砂竖线 */
body.vert .txt{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;height:100vh;padding:22px 18px;}
body.vert section.ch h2{margin:0 .35em 0 .95em;}
body.vert .note{margin:0 .3em 0 .6em;}
body.vert .s.cur{background:rgba(158,59,43,.12);border-bottom-color:transparent;border-left:2px solid #9E3B2B;}
body.vert .s.cur.gap{background:rgba(169,124,44,.20);border-left-style:dashed;}
body.vert p{text-align:start;}
/* 竖版分页（v1.8.0）：页面静止——禁止手势自由滚动（程序滚动翻页不受影响） */
body.vert{touch-action:none;overscroll-behavior:none;}
/* 左缘翻页提示：只在左缘中部留一个 ≤20dp 的淡色小箭头，不占正文列宽（正文仍按全宽排） */
#pgHint{display:none;position:fixed;left:3px;top:50%;transform:translateY(-50%);font-size:22px;line-height:1;color:rgba(38,34,28,.20);pointer-events:none;z-index:5;}
body.vert #pgHint{display:block;}
</style>
</head>
<body class="__CLASSES__">
<div class="txt" id="txt"></div>
<div id="pgHint">‹</div>
<script>
var BOOK = __BOOK_JSON__;
var stateTrad = __TRAD__;
var notesVer = '__NOTES_VER__';
var cur = -1;
var gapOn = false;
var immersive = false;
var flat = [];
BOOK.chapters.forEach(function(ch){
  ch.sentences.forEach(function(s){ s._i = flat.length; flat.push(s); });
});
function isCJK(c){
  var n = c.codePointAt(0);
  /* 含扩展区（论语有少量扩展 B–J 区生僻字，如简体「𫐐/𬶍」） */
  return (n >= 0x4E00 && n <= 0x9FFF) || (n >= 0x3400 && n <= 0x4DBF) ||
         (n >= 0x20000 && n <= 0x323AF);
}
function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function sentHTML(s){
  var text = stateTrad ? s.textT : s.textS;
  var pi = 0, out = '';
  /* 按码点遍历：扩展区字是 UTF-16 代理对，按下标遍历会把一个字拆成两半 */
  for (const c of text){
    if (isCJK(c)){
      var py = (s.pinyin && pi < s.pinyin.length) ? s.pinyin[pi] : '';
      pi++;
      out += py ? '<ruby>' + c + '<rt>' + esc(py) + '</rt></ruby>' : c;
    } else {
      out += esc(c);
    }
  }
  return '<span class="s' + (s.noAudio ? ' na' : '') + '" id="si' + s._i +
         '" data-i="' + s._i + '">' + out + '</span>';
}
/* ===== 注释（v1.9.0）=====
   句子对象的 nt 字段由 ContentRepo 注入：nt.zj / nt.jz = {t 注文, a 块首拉平下标,
   b 块末拉平下标}，是「覆盖本句的那一块」在该版本下的判定结果。显示时优先当前
   选定版本（notesVer），该版本无块覆盖才回退另一家，页脚如实标实际显示的那家。
   古人按段注、块内每句共用此注，所以每句后面都挂同一块注（本节口径）。
   注块是句子 span 的同级后随元素（不在 .s 内部，不干扰小句拆分与点句 seek）。 */
function noteFor(s){
  if (!s || !s.nt) return null;
  var k1 = notesVer === 'zhijie' ? 'zj' : 'jz';
  var k2 = k1 === 'zj' ? 'jz' : 'zj';
  if (s.nt[k1]) return {t:s.nt[k1].t, a:s.nt[k1].a, b:s.nt[k1].b, ver:k1};
  if (s.nt[k2]) return {t:s.nt[k2].t, a:s.nt[k2].a, b:s.nt[k2].b, ver:k2};
  return null;
}
function noteFooter(n){
  var lab = n.ver === 'zj' ? '张居正的版本' : '朱熹的版本';
  if (n.b > n.a) lab += ' · 本注管第 ' + (n.a + 1) + '–' + (n.b + 1) + ' 句';
  return lab + ' ⌄';
}
function noteHTML(s){
  var n = noteFor(s);
  if (!n) return '';
  return '<span class="ntb" id="nt' + s._i + '"><span class="ntt">' + esc(n.t) +
         '</span><span class="ntf">' + esc(noteFooter(n)) + '</span></span>';
}
function fillNote(i){
  var d = document.getElementById('nt' + i);
  if (!d) return;
  var n = noteFor(flat[i]);
  if (!n) return;
  d.querySelector('.ntt').textContent = n.t;
  d.querySelector('.ntf').textContent = noteFooter(n);
}
/* 版本切换：全书注块按新版本重填（文本＋页脚），选择由原生侧持久化后回推 */
function setNotesVer(v){
  notesVer = v;
  for (var i = 0; i < flat.length; i++) fillNote(i);
}
function setNotesOn(on){
  document.body.classList.toggle('noteson', !!on);
}
/* 当前句的注块同步亮起：与 markCur 同步调用；同块内换句时新句的注块接棒亮起
   （块内每句各有一份同文注块，亮的始终是当前句那一份） */
var curNoteEl = null;
function markNote(i){
  if (curNoteEl){ curNoteEl.classList.remove('cur'); curNoteEl = null; }
  if (i >= 0){
    var n = document.getElementById('nt' + i);
    if (n){ n.classList.add('cur'); curNoteEl = n; }
  }
}
/* 翻页式跟随（v1.4.2，用户要求像读书翻页，不要当前句永远居中）：
   - 当前句完整落在可视区内 → 绝不滚动；
   - 当前句跑出可视区（横排在上方/下方之外、竖排在左侧/右侧之外，含 seek 回前面）
     → 一次性翻一页：scrollIntoView({block:'start'}) 让它落到新一页的页首——
     横排 block start = 视口顶部（scroll-margin-top 留 14px 边距）；
     竖排 writing-mode 下 block 轴为右→左，block start = 视口右端
     （scroll-margin-right 留 14px 边距），即句的起始边贴到页首。 */
function sentenceVisible(el){
  var r = el.getBoundingClientRect();
  if (document.body.classList.contains('vert')){
    return r.left >= -1 && r.right <= window.innerWidth + 1;
  }
  return r.top >= -1 && r.bottom <= window.innerHeight + 1;
}
function pageToSentence(el){
  if (sentenceVisible(el)) return;
  el.scrollIntoView({block:'start', inline:'nearest'});
}
/* ===== 竖版分页（v1.8.0，用户定案：一屏一页、页面静止、像翻书）=====
   原理：竖排下整幅正文是从右往左延展的长卷，窗口横向滚动。页宽 = 视口宽 W；
   句子位置用「距长卷起始边（右端）的距离 d」度量：d = txtRect.right - elRect.right
   （两 rect 随滚动同移，d 与滚动位置无关）；页号 = floor(d / W)，固定页格。
   翻页 = window.scrollTo 到该页的 scrollLeft：Chromium 竖排（vertical-rl）是
   负值模型，第 k 页 scrollLeft = -k*W，behavior:'smooth' 即横向滑动动画。
   当前句只原地变色高亮、绝不自动滚动；仅当播放/跟读推进到的句子不在当前页
   时才翻页。手动翻页（点左/右缘 28px 热区或左右滑）走 flipPage，并通知原生侧
   暂停跟随（与既有 userScrolled 机制一致）。横版一律不走这套逻辑。 */
var pgCur = 0, pgTotal = 0;
function isVert(){ return document.body.classList.contains('vert'); }
function txtEl(){ return document.getElementById('txt'); }
function contentWidth(){
  var tr = txtEl().getBoundingClientRect();
  var w = tr.width;
  var fin = document.getElementById('fin');
  if (fin) w = Math.max(w, tr.right - fin.getBoundingClientRect().left);
  return w;
}
function vertMeasure(){
  pgTotal = Math.max(1, Math.ceil(contentWidth() / window.innerWidth));
}
function pageOfSentence(el){
  var tr = txtEl().getBoundingClientRect();
  var r = el.getBoundingClientRect();
  var p = Math.floor((tr.right - r.right) / window.innerWidth);
  return Math.max(0, Math.min(pgTotal - 1, p));
}
function reportPage(){
  if (window.Bridge && Bridge.pageInfo)
    Bridge.pageInfo(isVert() ? pgCur + 1 : 0, isVert() ? pgTotal : 0);
}
function goPage(k, animate){
  if (!isVert()) return;
  vertMeasure();
  k = Math.max(0, Math.min(pgTotal - 1, k));
  pgCur = k;
  window.scrollTo({left: -k * window.innerWidth, behavior: animate ? 'smooth' : 'auto'});
  reportPage();
}
function vertFollow(el){
  vertMeasure();
  var p = pageOfSentence(el);
  if (p !== pgCur) goPage(p, true);
}
/* 布局变化（字号/注音/繁简重渲/旋转）后重新分页，并回到当前句所在页（无当前句则保持页号、越界钳制） */
function repaginate(){
  if (!isVert()){ reportPage(); return; }
  vertMeasure();
  var target = pgCur;
  if (cur >= 0){
    var el = document.getElementById('si' + cur);
    if (el) target = pageOfSentence(el);
  }
  goPage(target, false);
}
function flipPage(dir, manual){
  if (!isVert()) return;
  vertMeasure();
  var k = pgCur + dir;
  if (k < 0 || k > pgTotal - 1) return;
  goPage(k, true);
  if (manual) Bridge.userScrolled();
}
function markCur(i, scroll){
  if (cur >= 0){
    if (splitEl && splitIdx === cur) unsplit();
    var p = document.getElementById('si' + cur);
    if (p){ p.classList.remove('cur'); p.classList.remove('gap'); }
  }
  cur = i;
  if (i >= 0){
    var el = document.getElementById('si' + i);
    if (el){
      el.classList.add('cur');
      if (gapOn) el.classList.add('gap');
      splitSentence(el, flat[i]);
      if (scroll){ if (isVert()) vertFollow(el); else pageToSentence(el); }
    }
  }
  markNote(i);
}
function setCur(i, scroll){ markCur(i, scroll); }
/* ===== 小句级高亮（v1.8.2）=====
   普通播放时把当前句按 breaks 拆成小句 span（切分与逗号级 SRT 完全同源：
   句内按 breaks.p 断开、标点后收尾符归前一小句、句末小句到 endMs），
   只给播放位置所在小句加 .cur（朱砂）。当前句的判定/跟随/seek 仍以整句为
   单位（markCur/pageToSentence/vertFollow 不变）；只在当前句变化时重建子
   span、小句变化时只挪 class。跟读模式不拆小句（setFollowMode 还原整句，
   保持既有整句高亮＋gap 呈现）。无 breaks 的句子整句即一个小句、不拆。 */
var CLOSERS = new Set(Array.from('」』）》”’】〕〉'));
var splitEl = null, splitOrigHTML = null, splitIdx = -1;
var wantClause = 0, curClause = -1;
var followMode = false;
function clauseRanges(s){
  var text = stateTrad ? s.textT : s.textS;
  if (!s.breaks || !s.breaks.length) return null;
  var cps = Array.from(text);
  var u16 = new Array(cps.length), acc = 0;
  for (var j = 0; j < cps.length; j++){ u16[j] = acc; acc += cps[j].length; }
  var ends = [];
  for (var bi = 0; bi < s.breaks.length; bi++){
    var j = u16.indexOf(s.breaks[bi].p);
    if (j < 0) continue;
    var e = j;
    while (e + 1 < cps.length && CLOSERS.has(cps[e + 1])) e++;
    if (e >= cps.length - 1) continue;
    ends.push(e);
  }
  if (!ends.length) return null;
  var ranges = [], prev = 0;
  for (var k = 0; k < ends.length; k++){ ranges.push([prev, ends[k] + 1]); prev = ends[k] + 1; }
  if (prev < cps.length) ranges.push([prev, cps.length]);
  return ranges.length > 1 ? ranges : null;
}
function clauseHTML(s, ranges){
  var text = stateTrad ? s.textT : s.textS;
  var cps = Array.from(text);
  var pi = 0, out = '<span class="cl" data-cl="0">', ci = 0;
  for (var j = 0; j < cps.length; j++){
    if (ci < ranges.length - 1 && j === ranges[ci][1]){
      ci++;
      out += '</span><span class="cl" data-cl="' + ci + '">';
    }
    var c = cps[j];
    if (isCJK(c)){
      var py = (s.pinyin && pi < s.pinyin.length) ? s.pinyin[pi] : '';
      pi++;
      out += py ? '<ruby>' + c + '<rt>' + esc(py) + '</rt></ruby>' : c;
    } else out += esc(c);
  }
  return out + '</span>';
}
function applyClause(){
  if (!splitEl){ curClause = -1; return; }
  var cls = splitEl.querySelectorAll('.cl');
  if (curClause >= 0 && curClause < cls.length) cls[curClause].classList.remove('cur');
  curClause = (wantClause >= 0 && wantClause < cls.length) ? wantClause : -1;
  if (curClause >= 0) cls[curClause].classList.add('cur');
}
function setClause(k){ wantClause = k; if (splitEl) applyClause(); }
function unsplit(){
  if (!splitEl) return;
  splitEl.innerHTML = splitOrigHTML;
  splitEl.classList.remove('split');
  splitEl = null; splitOrigHTML = null; splitIdx = -1; curClause = -1;
}
function splitSentence(el, s){
  if (followMode || !s) return;
  var ranges = clauseRanges(s);
  if (!ranges) return;
  splitEl = el; splitOrigHTML = el.innerHTML; splitIdx = s._i;
  el.innerHTML = clauseHTML(s, ranges);
  el.classList.add('split');
  curClause = -1;
  applyClause();
}
function setFollowMode(on){
  followMode = !!on;
  if (followMode){ unsplit(); return; }
  if (cur >= 0 && splitIdx !== cur){
    var el = document.getElementById('si' + cur);
    if (el) splitSentence(el, flat[cur]);
  }
}
/* 跟读 gap 标记（v1.4.3）：只改当前句的呈现，不动高亮位置与翻页跟随 */
function setGap(on){
  gapOn = !!on;
  if (cur >= 0){
    var el = document.getElementById('si' + cur);
    if (el) el.classList.toggle('gap', gapOn);
  }
}
function render(){
  /* v1.5 分批渲染：论语单篇最长约 130 句、带注音的 DOM 节点数千，先出前两章
     立即可读，其余每批 4 章在后续帧补齐（元素齐了之后再补发一次当前句高亮），
     避免一次性 innerHTML 上万节点卡住首屏。大学/中庸章数少，行为与旧版无异。 */
  curNoteEl = null;
  var parts = [];
  BOOK.chapters.forEach(function(ch){
    var h = '<section class="ch"><h2>' + esc(ch.title) + '</h2>';
    if (ch.note) h += '<div class="note">' + esc(ch.note) + '</div>';
    h += '<p>';
    ch.sentences.forEach(function(s){ h += sentHTML(s); h += noteHTML(s); });
    h += '</p></section>';
    parts.push(h);
  });
  var finH = '<div id="fin"><div class="finline">—— 全文完 ——</div>' +
       '<button id="finBtn" type="button">已读到末尾 · 点此记一遍</button></div>';
  var el = document.getElementById('txt');
  var i = Math.min(2, parts.length);
  el.innerHTML = parts.slice(0, i).join('');
  function step(){
    if (i < parts.length){
      el.insertAdjacentHTML('beforeend', parts.slice(i, i + 4).join(''));
      i += 4;
      setTimeout(step, 0);
      return;
    }
    el.insertAdjacentHTML('beforeend', finH);
    document.getElementById('finBtn').addEventListener('click', function(e){
      e.stopPropagation();
      Bridge.finishRead();
    });
    if (cur >= 0) markCur(cur, false);
    repaginate();
  }
  if (i < parts.length) setTimeout(step, 0); else step();
}
function setTrad(t){ stateTrad = t; render(); }
function setFont(i){
  document.body.classList.remove('fs0','fs1','fs2','fs3');
  document.body.classList.add('fs' + i);
  requestAnimationFrame(repaginate);
}
function setPinyin(on){
  document.body.classList.toggle('nopy', !on);
  requestAnimationFrame(repaginate);
}
function setVert(v){
  document.body.classList.toggle('vert', v);
  if (v){ requestAnimationFrame(repaginate); }
  else { pgCur = 0; reportPage(); }
}
function goTop(){
  if (isVert()){ goPage(0, false); return; }
  window.scrollTo(0, 0);
  var e = document.querySelector('section.ch');
  if (e) e.scrollIntoView();
}
document.addEventListener('click', function(e){
  if (immersive){ immersive = false; Bridge.setImmersive(false); return; }
  if (isVert()){
    if (justSwiped()) return;
    /* 点左/右缘热区翻页（左 = 下一页、右 = 上一页，同竖排书翻页方向）；
       热区全透明、不占正文列宽，仅左缘中部有一个淡色小箭头提示 */
    if (e.clientX <= 28){ flipPage(1, true); return; }
    if (e.clientX >= window.innerWidth - 28){ flipPage(-1, true); return; }
  }
  /* 注释页脚＝版本切换入口（走原生对话框）；注块本体点按不触发任何动作（不 seek、不沉浸） */
  if (e.target.closest && e.target.closest('.ntf')){ Bridge.pickNoteVer(); return; }
  if (e.target.closest && e.target.closest('.ntb')) return;
  var t = e.target;
  var s = t.closest ? t.closest('.s') : null;
  if (s){
    var i = parseInt(s.getAttribute('data-i'), 10);
    if (s.classList.contains('na')) Bridge.naTap(); else Bridge.sentence(i);
    return;
  }
  if (t.closest && t.closest('#fin')) return;
  immersive = true;
  Bridge.setImmersive(true);
});
document.addEventListener('touchmove', function(){ Bridge.userScrolled(); }, {passive:true});
document.addEventListener('wheel', function(){ Bridge.userScrolled(); }, {passive:true});
/* 竖版：左右滑翻页（内容跟随手指方向：右滑露出下一页、左滑回上一页）；
   滑动后 350ms 内的合成 click 不再当作点按处理 */
var tsX = 0, tsY = 0, swipeAt = 0;
function justSwiped(){ return Date.now() - swipeAt < 350; }
document.addEventListener('touchstart', function(e){
  if (e.touches.length === 1){ tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; }
}, {passive:true});
document.addEventListener('touchend', function(e){
  if (!isVert() || !e.changedTouches.length) return;
  var dx = e.changedTouches[0].clientX - tsX;
  var dy = e.changedTouches[0].clientY - tsY;
  if (Math.abs(dx) >= 48 && Math.abs(dx) > 1.4 * Math.abs(dy)){
    flipPage(dx > 0 ? 1 : -1, true);
    swipeAt = Date.now();
  }
}, {passive:true});
/* 竖版禁止滚轮把长卷拖离页格（程序翻页不受影响） */
document.addEventListener('wheel', function(e){ if (isVert()) e.preventDefault(); }, {passive:false});
/* 旋转/窗口尺寸变化后重新分页，回到当前句所在页 */
var rszT = 0;
window.addEventListener('resize', function(){
  clearTimeout(rszT);
  rszT = setTimeout(repaginate, 120);
});
render();
</script>
</body>
</html>
