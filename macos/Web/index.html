<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>弦歌</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="gdon noteson">
<div class="app">
  <header class="toolbar">
    <div class="brand">弦歌</div>
    <div class="tools">
      <label class="tgl"><input type="checkbox" id="optPinyin" checked> 拼音</label>
      <label class="tgl"><input type="checkbox" id="optGd" checked> 古读标红</label>
      <label class="tgl"><input type="checkbox" id="optNotes" checked> 注释</label>
      <select id="optVer" title="注释版本"></select>
      <span class="sep"></span>
      <button id="optTrad" class="seg on" title="简繁切换">繁體</button>
      <button id="optVert" class="seg" title="横竖排切换">竖排</button>
    </div>
  </header>
  <div class="main">
    <aside class="sidebar">
      <div class="side-h">书目</div>
      <div id="bookList"></div>
      <div class="side-h" id="chapHead">篇章</div>
      <div id="chapList"></div>
    </aside>
    <section class="reader-wrap">
      <div id="notePanel" class="note-panel" hidden>
        <div class="np-h">注栏（点句查看）</div>
        <div id="notePanelBody" class="np-b">点一句，显示它所在注块的注释。</div>
      </div>
      <div id="reader" class="reader"><div class="txt" id="txt"></div></div>
    </section>
  </div>
  <footer class="player" id="playerBar">
    <div class="pl-meta">
      <div class="pl-chap" id="plChap">听读</div>
      <div class="pl-book" id="plBook"></div>
    </div>
    <div class="pl-main">
      <button id="plBack" class="pl-btn" title="后退 15 秒">−15</button>
      <button id="plPlay" class="pl-btn pl-play" title="播放 / 暂停">▶</button>
      <button id="plFwd" class="pl-btn" title="前进 15 秒">+15</button>
      <span class="pl-time" id="plCur">0:00</span>
      <input type="range" id="plSeek" min="0" max="0" step="0.1" value="0">
      <span class="pl-time" id="plDur">0:00</span>
    </div>
    <div class="pl-side">
      <button id="plLoop" class="pl-chip" title="循环模式（点击切换）">顺序播放</button>
      <select id="plRate" title="倍速">
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
      <button id="plAddAudio" class="pl-chip" title="为当前书选择本地音频文件">添加音频</button>
    </div>
  </footer>
</div>
<div class="modal-mask" id="editMask" hidden>
  <div class="modal">
    <div class="md-title" id="editTitle">今日遍数</div>
    <div class="md-row">
      <button id="editMinus" class="md-step" title="减一">−</button>
      <input id="editInput" type="text" inputmode="numeric" autocomplete="off">
      <button id="editPlus" class="md-step" title="加一">＋</button>
    </div>
    <div class="md-err" id="editErr"></div>
    <div class="md-btns">
      <button id="editCancel" class="md-btn">取消</button>
      <button id="editSave" class="md-btn on">存</button>
    </div>
  </div>
</div>
<audio id="audioEl" preload="auto"></audio>
<script src="bookdata.js"></script>
<script src="render.js"></script>
<script src="stats.js"></script>
<script src="playcore.js"></script>
<script src="player.js"></script>
<script src="app.js"></script>
</body>
</html>
